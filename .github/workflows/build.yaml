name: Build C++ Project for RaspberryPi2

on:
  push:
   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARMv7 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf
 
      - name: Compile with Makefile for RaspberryPi2 ARM
        run: make CXX=arm-linux-gnueabihf-g++

      - name: Verify ARM architecture
        run: file mHello

      - name: Test Run Output
        run: file ./mHello

      - name: Upload Compiled Binary
        uses:  actions/upload-artifact@v4
        with:
          name: rpi2-binary
          path: mHello
          retention-days: 1
