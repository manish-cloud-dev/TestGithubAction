name: Build C++ Project

on:
  push:
   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Compile with Makefile
        run: make

      - name: Test Run Output
        run: ./mHello

      - name: Upload Compiled Binary
        uses:  actions/upload-artifact@v4
        with:
          name: TestGithubAction-binary
          path: mHello
          retention-days: 1
